[package]
name = "overnoir"
version = "0.1.6"
description = ""
authors = [""]
license = ""
repository = ""
edition = "2021"
rust-version = "1.96.0"

[lib]
name = "overnoir_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.0", features = [
    "macos-private-api",
    "tray-icon",
    'image-png',
    "unstable",
] }
tauri-plugin-log = "2"
tauri-plugin-process = "2.3.1"
tauri-plugin-pinia = "4"
tauri-plugin-prevent-default = "5.0.0"
tauri-plugin-os = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
interprocess = "2.4.2"
uuid = { version = "1.23.1", features = ["v4"] }
dotenvy = "0.15.7"
tauri-plugin-opener = "2.5.4"
tauri-plugin-updater = "2"
tauri-plugin-stronghold = "2"
keyring = { version = "3.6.1", features = [
    "apple-native",
    "windows-native",
    "sync-secret-service",
] }
whoami = "1"
iota_stronghold = "2.1.0"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
reqwest = { version = "0.13.4", features = ["json", "form"] }
sysinfo = "0.30"
starship-battery = "0.8"
tokio = { version = "1.52.3", features = ["rt", "sync", "time", "fs"] }
chrono = "0.4.45"

[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2.1" }

[profile.dev.package.scrypt]
opt-level = 3
