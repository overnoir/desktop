name: Feature Request
description: Suggest a new feature
labels: [enhancement]
body:
  - type: textarea
    attributes:
      label: Problem
      description: What problem would this feature solve?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed Solution
      description: How should it work?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Alternatives
      description: Any alternative solutions you've considered?
    validations:
      required: false
  - type: textarea
    attributes:
      label: Additional Context
    validations:
      required: false
