name: "publish"

on:
  pull_request:
    types: [closed]
    branches:
      - main

jobs:
  build:
    if: |
      github.event_name == 'workflow_dispatch' || 
      (github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'dev')

    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin"
          - platform: "macos-latest"
            args: "--target x86_64-apple-darwin"
          - platform: "ubuntu-22.04"
            args: ""
          - platform: "ubuntu-22.04-arm"
            args: ""
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v7

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04' || matrix.platform == 'ubuntu-22.04-arm'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: install frontend dependencies
        run: bun install

      - name: Extract PR Description for Release Notes
        id: release_notes
        uses: actions/github-script@v7
        with:
          script: |
            let notes = '';

            if (context.payload.pull_request && context.payload.pull_request.body) {
              notes = context.payload.pull_request.body;
            } 
            else if (context.payload.head_commit && context.payload.head_commit.message) {
              notes = context.payload.head_commit.message;
            } 

            core.setOutput('body', notes);

      - uses: tauri-apps/tauri-action@v1
        env:
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API_URL: ${{ secrets.API_URL }}
          APPLE_SIGNING_IDENTITY: "-"
        with:
          releaseBody: ${{ steps.release_notes.outputs.body }}
          releaseName: "v__VERSION__"
          args: ${{ matrix.args }}
          tagName: v__VERSION__
          releaseDraft: true
          prerelease: false

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Extract version from tauri.conf.json
        id: get_version
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Publish Release (Undraft)
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const tag = `v${'${{ steps.get_version.outputs.version }}'}`;

            const releases = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            const targetRelease = releases.data.find(
              r => r.tag_name === tag && r.draft === true
            );

            if (targetRelease) {
              await github.rest.repos.updateRelease({
                release_id: targetRelease.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                draft: false,
              });
            }
